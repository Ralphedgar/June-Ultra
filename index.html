<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Konek-T - Application de messagerie PWA simple, rapide et légère.">
  <title>Konek-T</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="container">
    <!-- Section Authentification -->
    <section id="auth-section" class="card">
      <div class="brand">
        <h1>Konek-T</h1>
        <p class="subtitle">Messagerie rapide & légère</p>
      </div>

      <div class="tabs">
        <button id="tab-login" class="tab-btn active" type="button">Connexion</button>
        <button id="tab-register" class="tab-btn" type="button">Inscription</button>
      </div>

      <!-- Formulaire Connexion -->
      <form id="login-form" class="auth-form active">
        <h2>Se connecter</h2>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="votre@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Se connecter</button>
      </form>

      <!-- Formulaire Inscription -->
      <form id="register-form" class="auth-form hidden">
        <h2>Créer un compte</h2>
        <div class="form-group">
          <label for="register-username">Nom d'utilisateur</label>
          <input type="text" id="register-username" placeholder="Pseudo" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" placeholder="votre@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="register-password">Mot de passe</label>
          <input type="password" id="register-password" placeholder="Minimum 6 caractères" minlength="6" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary">S'inscrire</button>
      </form>

      <div id="auth-error" class="error-msg hidden"></div>
    </section>

    <!-- Section Chat / Messagerie -->
    <section id="chat-section" class="chat-container hidden">
      <!-- En-tête du Chat -->
      <header class="chat-header">
        <div class="user-info">
          <div class="avatar" id="user-avatar">U</div>
          <div>
            <span class="user-name" id="user-display-name">Utilisateur</span>
            <span class="status-badge">En ligne</span>
          </div>
        </div>
        <button id="logout-btn" class="btn btn-outline" type="button">Déconnexion</button>
      </header>

      <!-- Zone d'affichage des messages -->
      <main id="messages-container" class="messages-container">
        <div id="loading-spinner" class="spinner">Chargement des messages...</div>
      </main>

      <!-- Formulaire d'envoi de message -->
      <form id="message-form" class="message-form">
        <input type="text" id="message-input" placeholder="Écrivez un message..." required autocomplete="off">
        <button type="submit" class="btn btn-send" aria-label="Envoyer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
